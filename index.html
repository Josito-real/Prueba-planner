<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Krill Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
<style>
  /* ——— tokens ——— */
  :root{
    /* Krill palette, calmed down for software */
    --navy-950:#060e1f;
    --navy-900:#0a1830;
    --navy-800:#0f2142;
    --navy-700:#172c55;
    --navy-600:#23406e;
    --navy-500:#3a5a8a;
    --navy-400:#6a83a8;
    --navy-300:#9fb1cd;
    --navy-200:#c9d4e4;
    --navy-100:#e7ecf4;
    --navy-050:#f3f5fa;

    --paper:#fafaf8;
    --paper-2:#f2f2ee;
    --ink:#0b1220;
    --ink-2:#38465e;
    --ink-3:#6a7691;
    --ink-4:#98a2b6;
    --line:#e4e6ec;
    --line-2:#edeef3;

    /* accent — swappable via Tweaks */
    --accent:#1E5BEF;
    --accent-2:#4FD0E7;
    --accent-ink:#0a2a8a;
    --accent-wash: color-mix(in oklab, var(--accent) 10%, white);

    /* semantic */
    --ok:#1f9d55;
    --warn:#c08a2a;
    --risk:#c0452a;
    --muted:#8a93a6;

    /* density */
    --row-h: 40px;
    --pad-y: 10px;
    --pad-x: 14px;
    --radius: 10px;
    --radius-sm: 6px;

    --font-sans:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono:'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --font-serif:'Fraunces', ui-serif, Georgia, serif;
  }
  [data-density="compact"]{
    --row-h: 32px;
    --pad-y: 6px;
    --pad-x: 10px;
  }
  [data-density="spacious"]{
    --row-h: 48px;
    --pad-y: 14px;
    --pad-x: 18px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  button{font-family:inherit;color:inherit}
  input,select,textarea{font-family:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:color-mix(in oklab, var(--accent) 25%, white);color:var(--ink)}

  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d5d9e2;border-radius:10px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#b8bfcc;background-clip:content-box;border:2px solid transparent}

  #root{min-height:100vh}
</style>
</head>
<body>
<div id="root"></div>

<!-- EDITMODE config block (defaults; host rewrites on persist) -->
<script>
  window.__TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "electric",
    "density": "comfortable",
    "heroVariant": "classic",
    "mobile": false
  }/*EDITMODE-END*/;
</script>

<script type="module" src="/src/main.tsx"></script>
</body>
</html>
